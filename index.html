<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mortelbook</title>
<meta name="theme-color" content="#0e211b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="js/shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eee6;--surface:#fbfcf8;--sunk:#dfe6db;--line:#cbd6c7;--ink:#17322a;--muted:#5b6e63;
  --gold:#9a7614;--goldsoft:#efe2b8;--red:#b0402b;--green:#2f7a4b;--bubble-me:#17322a;--bubble-me-ink:#f4efe0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e211b;--surface:#15302a;--sunk:#10261f;--line:#2a4a40;--ink:#ece4d0;--muted:#9fb1a3;
  --gold:#d4af37;--goldsoft:#3a3a1e;--red:#d86a52;--green:#7cc08d;--bubble-me:#d4af37;--bubble-me-ink:#14251f;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e211b;--surface:#15302a;--sunk:#10261f;--line:#2a4a40;--ink:#ece4d0;--muted:#9fb1a3;
  --gold:#d4af37;--goldsoft:#3a3a1e;--red:#d86a52;--green:#7cc08d;--bubble-me:#d4af37;--bubble-me-ink:#14251f;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
header.top .in{max-width:560px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.logo{font-family:"IM Fell English",Georgia,serif;font-size:30px;line-height:1;letter-spacing:.01em;margin:0}
.logo i{color:var(--gold)}
.sub{font-size:13px;color:var(--muted)}
.banner{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.banner[hidden]{display:none}

/* composer */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.composer .row{display:flex;gap:10px;align-items:flex-start}
textarea,input[type=text]{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea{min-height:64px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);color:#1a1a10}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}

/* posts */
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--sunk);border:1px solid var(--line)}
.av.s{width:28px;height:28px;font-size:15px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.post .head{display:flex;gap:10px;align-items:center}
.post .who{font-weight:700}
.post time{display:block;font-size:12.5px;color:var(--muted)}
.post .body{margin:10px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.post.mine{border-color:var(--gold)}
.cwrap{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.clike{background:none;border:0;font-size:13px;padding:2px 6px;color:var(--muted)}
.clike span{font-size:12px}
.likerow{display:flex;align-items:center;gap:8px;margin:4px 0}
.likebtn{background:none;border:0;font-size:20px;padding:2px 4px;line-height:1}
.likebtn.on{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.3)}}
.likes{font-size:13.5px;color:var(--muted);margin:4px 0}
.comments{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line)}
.comments li{display:flex;gap:8px;margin:0 0 8px;align-items:flex-start}
.comments .ct{background:var(--sunk);border-radius:12px;padding:6px 10px;overflow-wrap:anywhere}
.comments .ct b{display:block;font-size:13.5px}
.creply{display:flex;gap:8px;margin-top:8px}
.creply input{padding:8px 12px;border-radius:999px}
.pending{font-size:14px;color:var(--muted);font-style:italic;margin:6px 0}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* dm list */
h2.sec{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:24px;margin:18px 0 10px}
.dmrow{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.dmrow .meta{flex:1;min-width:0}
.dmrow .last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap;color:var(--muted)}

/* chat */
.chathead{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,58px));z-index:4;background:var(--bg)}
.back{background:none;border:0;font-size:22px;padding:4px 8px 4px 0}
.thread{display:flex;flex-direction:column;gap:6px;padding-bottom:calc(200px + var(--kb,0px))}
.retry{align-self:center;margin:2px 0 6px}
.thread .event{margin-top:10px}
.tbtn{flex:none;background:var(--sunk);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:18px}
.tbtn[aria-pressed="true"]{border-color:var(--gold)}
.toolp{max-width:560px;margin:0 auto 10px}
.toolp .chips{margin:6px 0}
.gname{font-size:12px;font-weight:700;margin-bottom:2px;opacity:.8}
.msg{max-width:82%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:4px}
.msg em{font-style:italic;opacity:.8}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:13px;padding:2px}
.chatbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.chatbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.chatbar input{border-radius:999px}

/* gauge */
.gauge{position:relative;height:10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);margin:8px 0 4px;overflow:hidden}
.gauge::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.gauge span{position:absolute;top:0;bottom:0}
.gauge .pos{left:50%;background:var(--green)}
.gauge .neg{right:50%;background:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card .head{display:flex;gap:10px;align-items:center}
.card .nm{font-weight:700}
.small{font-size:13.5px;color:var(--muted)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.mem{margin:6px 0 0;padding-left:18px;font-size:14px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] .ic{transform:translateY(-1px)}
body.typing nav.tabs{display:none}
.event{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:16px;margin:0 0 14px}
.evtitle{font-family:"IM Fell English",Georgia,serif;font-size:24px;line-height:1.15;margin-bottom:10px;color:var(--gold)}
.event .scene{font-family:"IM Fell English",Georgia,serif;font-size:17.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.event .step+.step{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:500}
.choice:active{border-color:var(--gold)}
.picked{margin:10px 0 0;font-size:14px;color:var(--gold);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1a10;font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.storyrow{width:100%;text-align:left;display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.storyrow .t{font-family:"IM Fell English",Georgia,serif;font-size:20px;line-height:1.2}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:12px}
.reader h2{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:28px;line-height:1.15;margin:0 0 6px;color:var(--gold)}
.rtext{font-family:"IM Fell English",Georgia,serif;font-size:18.5px;line-height:1.7;overflow-wrap:anywhere}
.rtext p{margin:0 0 1em}
.rtext .chap{text-align:center;color:var(--gold);margin:1.4em 0 1em;font-size:16px;letter-spacing:.08em}
.tabsmini{display:flex;gap:8px;margin:14px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.big{font-family:"IM Fell English",Georgia,serif;font-size:22px;color:var(--gold);line-height:1.2;margin:2px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:10px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar span{width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.bar em{font-style:normal;font-size:10px;color:var(--muted);margin-top:3px}
.frow{margin-top:10px}.flab{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.frow .gauge::after{display:none}
.whobtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
@media (max-width:380px){.stats{grid-template-columns:1fr}}
.av{position:relative;cursor:pointer}
.av.live::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#3bb36b;border:2px solid var(--surface)}
.post .who,.ct b,[data-prof]{cursor:pointer}
.rxpick{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin:4px 0;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.rxpick button{background:none;border:0;font-size:22px;padding:2px 4px;line-height:1}
.rxpick button:active{transform:scale(1.3)}
.seen{align-self:flex-end;font-size:12px;color:var(--muted);margin:-2px 4px 2px}
.post.flash{animation:flash 2s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
#who{color:var(--muted)}
.nbadge{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:0 4px;margin-left:3px;vertical-align:top}
.nrow{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 0 8px;font-size:15px}
.nrow.unread{border-color:var(--gold);background:var(--goldsoft)}
.nic{font-size:20px;flex:none;width:26px;text-align:center}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center}
.pbig{font-size:58px;line-height:1.1;display:inline-block}
.pname{font-family:"IM Fell English",Georgia,serif;font-size:26px;margin:4px 0 2px}
.pbio{margin:10px 0;white-space:pre-wrap}
.pcard textarea{text-align:left;margin-top:8px}
.pstats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.pstats b{color:var(--ink)}
.pcard .chips{justify-content:center}
.tag{color:var(--gold);font-weight:600;cursor:pointer}
.photo{display:block;margin:6px 0;padding:10px 12px;border-radius:10px;background:var(--sunk);border:1px dashed var(--line);font-style:italic;color:var(--muted)}
.rpbtn{background:none;border:0;font-size:17px;margin-left:auto;padding:2px 6px;opacity:.8}
.likerow{width:100%}
.quote{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--sunk);cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
.poll{margin:8px 0;display:flex;flex-direction:column;gap:6px}
.popt{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--sunk);font-size:15px}
button.popt:active{border-color:var(--gold)}
.popt.mine{border-color:var(--gold)}
.pfill{position:absolute;left:0;top:0;bottom:0;background:var(--goldsoft);z-index:0}
.pt,.pv{position:relative;z-index:1}.pv{font-size:13px;color:var(--muted);white-space:nowrap}
.polled{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trends{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 12px}
.trends .chips{margin-top:6px}.trends .chip{cursor:pointer}
.snaps{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.snaps::-webkit-scrollbar{display:none}
.snapb{flex:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);width:62px}
.ring{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.ring.seen{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line)}
.ring.add{box-shadow:0 0 0 1px var(--line)}
.ring i{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1a1a10;font-style:normal;font-size:15px;font-weight:700;line-height:20px;text-align:center}
#ov{position:fixed;inset:0;z-index:30;background:#000}
.ovin{position:absolute;inset:0;display:flex;flex-direction:column;color:#f4efe0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.ovin .small{color:rgba(244,239,224,.75)}
.sbars{display:flex;gap:4px;margin-bottom:10px}
.sbars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.sbars span.done,.sbars span.cur{background:#f4efe0}
.ovhead{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.ovhead .av{background:rgba(255,255,255,.12);border-color:transparent}
.ovx{margin-left:auto;background:none;border:0;color:#f4efe0;font-size:24px;padding:4px 8px}
.ovtext{flex:1;display:flex;flex-direction:column;justify-content:center;font-family:"IM Fell English",Georgia,serif;font-size:24px;line-height:1.45;text-align:center;padding:10px 6px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.ovtext .photo{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#f4efe0;font-size:18px;margin-bottom:14px}
.ovtext textarea{min-height:200px;background:rgba(255,255,255,.1);color:#f4efe0;border-color:rgba(255,255,255,.25);font-family:inherit;font-size:20px}
.ovprev,.ovnext{position:absolute;top:90px;bottom:130px;width:35%;background:none;border:0;z-index:1}
.ovprev{left:0}.ovnext{right:0;width:65%}
.ovfoot{position:relative;z-index:2}
.ovfoot input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#f4efe0}
.ovfoot input::placeholder{color:rgba(244,239,224,.6)}
.chnav{margin-top:12px}.chnav .chips{gap:6px}
.chn{min-width:38px;text-align:center;position:relative}
.chn .badge{position:absolute;top:-2px;right:-2px;margin:0}
.ghostc{opacity:.4}
.chbot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.badge{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:4px;vertical-align:middle}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .3s}
.toast[hidden]{display:none}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}.toast{transition:none}}
.askov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.askov .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:340px;width:100%}
.askov .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.crbtn{border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:2px 6px}
li.crep{margin-left:22px}
.reto{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.rechip{font-size:13px;color:var(--muted);margin:6px 0 -2px;display:flex;align-items:center;gap:4px}
.rxwho{background:none;border:0;padding:2px 4px;color:var(--muted);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.rxrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.mrxb{background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:13px;padding:0 7px;margin-top:-10px;line-height:1.6;color:var(--ink)}
.mrxb.me{align-self:flex-end;margin-right:8px}.mrxb.them{align-self:flex-start;margin-left:8px}
.msg[data-mrx]{cursor:pointer;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<header class="top"><div class="in"><h1 class="logo">Mortel<i>book</i></h1><span style="display:flex;gap:8px;align-items:center"><button class="whobtn" id="aibtn" aria-label="Réglages IA">⚙️</button><button class="whobtn" id="statsbtn" aria-label="Consommation">📊</button><button class="whobtn" id="bellbtn" aria-label="Notifications">🔔<span id="bellN"></span></button><button class="whobtn" id="who" aria-label="Mon profil"></button></span></div></header>
<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>

const CH=50000,chunkMeta={};
function splitChunks(j){const out=[];let i=0;while(i<j.length){let e=Math.min(j.length,i+CH);if(e<j.length){const c=j.charCodeAt(e-1);if(c>=0xD800&&c<=0xDBFF)e--}out.push(j.slice(i,e));i=e}return out.length?out:['']}
async function putKey(col,k,j,at){
  const parts=splitChunks(j);const old=chunkMeta[k];
  let nv=null;
  if(parts.length===1)await col.doc(k).set({s:j,at:at||now()});
  else{nv=uid();for(let i=0;i<parts.length;i++)await col.doc(k+'~'+nv+'~'+i).set({s:parts[i]});await col.doc(k).set({n:parts.length,v:nv,at:at||now()})}
  if(old&&old.v&&old.v!==nv)for(let i=0;i<old.n;i++)col.doc(k+'~'+old.v+'~'+i).delete().catch(()=>{});
  if(nv)chunkMeta[k]={n:parts.length,v:nv};else delete chunkMeta[k];
}
async function getKey(col,k){
  const sn=await col.doc(k).get();if(!sn.exists)return null;
  const d=sn.data()||{};
  if(typeof d.s==='string')return d.s;
  if(d.n&&d.v){
    chunkMeta[k]={n:d.n,v:d.v};
    const ps=await Promise.all(Array.from({length:d.n},(_,i)=>col.doc(k+'~'+d.v+'~'+i).get()));
    if(ps.some(x=>!x.exists))throw{code:'chunk_missing'};
    return ps.map(x=>x.data().s).join('');
  }
  return null;
}
async function putRetry(col,k,j,at){
  let err=null;

    catch(e){err=e;if(!e||e.code!=='unavailable')break;await new Promise(r=>setTimeout(r,800+Math.random()*800))}
  }
  return err||{code:'erreur'};
}

async function syncRemote(){

}

function frame(){
  return `Contexte : « Mortelbook » est un faux réseau social qui sert de jeu de relation, façon Sims ou livre dont on est le héros. Des personnages de fiction y ont un compte et vivent comme s'ils étaient réels. La joueuse s'appelle ${S.me.name}. Tout se passe en français. Dans le JSON, désigne toujours les personnages par leur id EXACT (celui indiqué après ###), jamais par leur nom. Un personnage ne cite ou ne répond qu'à des commentaires qui existent vraiment (déjà affichés ou écrits dans ta réponse). Tous les personnages sont adultes. Dans les posts et commentaires publics, comme sur un vrai réseau, ils utilisent parfois un hashtag (#...) inventé à leur façon, avec modération (pas à chaque fois). Une romance est possible quand la relation est élevée, mais elle reste suggestive, jamais explicite. Les relations ENTRE personnages évoluent aussi d'elles-mêmes au fil de leurs échanges : des affinités, des amitiés, des rivalités, voire des romances entre personnages peuvent naître si c'est cohérent avec eux ; quand deux personnages sont proches, ça se voit (complicité, taquineries, soutien, jalousie). Emojis : chaque personnage les utilise selon son caractère, comme il le ferait vraiment sur un réseau social (un personnage joueur ou théâtral peut en mettre un ou deux, un personnage austère n'en met jamais ou presque). Les gestes, expressions et tons s'écrivent entre astérisques : bienvenus en messages privés et en groupe pour faire sentir l'intention (ironie ou sérieux, tendresse…), plus rares dans les commentaires publics. Les réactions physiques marquées (rougir, etc.) seulement quand la situation les justifie. Pas d'emoji « signature » à la fin de chaque message, pas la même formule toute faite à chaque fois : varie comme une vraie personne (les petits noms affectueux restent bienvenus).`;
}
const tier=s=>TIERS.find(t=>s>=t.min)||TIERS[TIERS.length-1];

function setPartner(c,target){

const rel=s=>tier(s).label;
const plain=l=>l.replace(/^\S+\s/,'');
const DIFF={'Facile':1.3,'Normal':1,'Difficile':0.6,'Très difficile':0.4};
const DAILY_CAP=12;
function applyDelta(c,d,why,follow){
  d=clamp(Math.round(Number(d)||0),-10,10);
  if(!d)return;
  if(d>0){
    const mult=DIFF[c.difficulty||'Normal']||1;
    const raw=d*mult*(1-Math.max(0,c.score)/140);
    d=Math.floor(raw)+(Math.random()<raw-Math.floor(raw)?1:0);
    const day=today();if(c.gainDay!==day){c.gainDay=day;c.gainToday=0}
    const room=DAILY_CAP-(c.gainToday||0);
    if(room<=0){toast(`${c.emoji} ${c.name} a apprécié, mais il lui faut du temps pour s'attacher davantage aujourd'hui.`);return}
    d=Math.min(d,room);
    if(d<=0)return;
    c.gainToday=(c.gainToday||0)+d;
  }
  const before=tierFor(c);const old=c.score;
  c.score=clamp(c.score+d,-100,100);
  if(old<15&&c.score>=15)notify('➕',`${c.name} te suit maintenant.`,{t:'profile',id:c.id});
  if(old>=15&&c.score<15)notify('➖',`${c.name} ne te suit plus.`,{t:'profile',id:c.id});
  const after=tierFor(c);
  let msg=`${c.emoji} ${c.name} : ${d>0?'+':''}${d}`;
  if(why)msg+=` (${why})`;
  if(before.label!==after.label){
    msg=`${c.emoji} Nouveau palier avec ${c.name} : ${after.label}. Désormais, ${c.name.split(' ')[0]} ${after.unlock}.`;
    notify('💞',`Nouveau palier avec ${c.name} : ${after.label}.`,{t:'profile',id:c.id});

  }
  toast(msg);
}
const pk=(a,b)=>[a,b].sort().join('|');
const PAIR_TIERS=[{min:85,label:'💘 Liés'},{min:60,label:'💞 Inséparables'},{min:25,label:'🤝 Complices'},{min:-24,label:'😐 Neutres'},{min:-59,label:'⚡ Rivaux'},{min:-100,label:'⚔️ Ennemis jurés'}];
const pairTier=s=>PAIR_TIERS.find(t=>s>=t.min)||PAIR_TIERS[PAIR_TIERS.length-1];
function pairScore(a,b){S.pairs=S.pairs||{};return S.pairs[pk(a,b)]||0}
function applyPairs(pd){
  if(!pd||typeof pd!=='object')return;
  S.pairs=S.pairs||{};
  Object.keys(pd).forEach(k=>{
    const [a,b]=String(k).split('|');if(!a||!b||a===b||!charById(a)||!charById(b))return;
    const d=clamp(Math.round(Number(pd[k])||0),-5,5);if(!d)return;

    S.pairs[key]=clamp((S.pairs[key]||0)+d,-100,100);

  });
}
const MOODS=["d'humeur massacrante","étrangement de bonne humeur","épuisé","nostalgique","taquin","préoccupé par quelque chose qu'il ne dit pas","inspiré","susceptible","mélancolique","plein d'énergie","distrait","d'humeur à flirter"];
function mood(c){

  const m=MOODS[seed%MOODS.length];

function addressOf(c){
  if(c.addrLock)return c.addrLock;
  if(c.partner==='me'&&(c.voice||[]).length){const v=(c.voice||[]).join(' ').toLowerCase();const tu=(v.match(/\b(tu|toi|ton|ta|tes)\b/g)||[]).length,vo=(v.match(/\b(vous|votre|vos)\b/g)||[]).length;return vo>tu?'vous':'tu'}
  if(c.address)return c.address;
  const t=(S.dms[c.id]||[]).filter(m=>m.from==='them').slice(-6).map(m=>' '+m.text.toLowerCase()+' ').join(' ');
  const tu=(t.match(/[\s'’](tu|te|toi|ton|ta|tes|t['’])[\s,.!?]/g)||[]).length;
  const vous=(t.match(/[\s'’](vous|votre|vos)[\s,.!?]/g)||[]).length;

}
function recentTics(c){
  const texts=[];
  (S.dms[c.id]||[]).filter(m=>m.from==='them').slice(-10).forEach(m=>texts.push(m.text));
  (S.groups||[]).forEach(g=>(g.msgs||[]).filter(m=>m.from===c.id).slice(-4).forEach(m=>texts.push(m.text)));
  S.posts.slice(0,15).forEach(p=>{if(p.author===c.id)texts.push(p.text);p.comments.filter(x=>x.author===c.id).forEach(x=>texts.push(x.text))});
  const acts=[];texts.forEach(t=>(String(t).match(/\*([^*\n]{3,160})\*/g)||[]).forEach(a=>acts.push(a.replace(/\*/g,'').trim())));
  const uniq=[...new Set(acts.reverse())].slice(0,8);
  const ends={};texts.slice(-8).forEach(t=>{const m=String(t).trim().match(/(\p{Extended_Pictographic}[\u{FE0F}\u{200D}\p{Extended_Pictographic}]*\s*)+$/u);if(m){const k=m[0].trim();ends[k]=(ends[k]||0)+1}});
  const sig=Object.entries(ends).filter(([k,v])=>v>=2).map(([k])=>k);
  const words={};texts.slice(-8).forEach(t=>{(String(t).toLowerCase().match(/mon amour|ma chère|mortelle|miss|chérie|ma belle|très chère/g)||[]).forEach(w=>words[w]=(words[w]||0)+1)});
  const pet=Object.entries(words).filter(([k,v])=>v>=2).map(([k])=>k);
  let r='';
  if(uniq.length)r+=`\nGestes et réactions qu'il a DÉJÀ utilisés récemment (ne réutilise pas ces gestes précis, même reformulés : choisis-en d'autres) : ${uniq.map(a=>`« ${a.slice(0,90)} »`).join(' ; ')}.`;
  if(sig.length)r+=`\nIl termine trop souvent ses messages par ${sig.join(' ')} : ne le fais pas cette fois.`;
  return r;
}
/* Voix de référence : ses messages d'avant la version web (écrits avec Claude), gardés comme modèle de ton. */
function voiceBank(c){
  if(Array.isArray(c.voice)&&c.voice.length)return c.voice;
  const imp=+(String(S.sid||'').match(/^import-(\d+)/)||[])[1]||0;
  const th=(S.dms[c.id]||[]).filter(m=>m.from==='them'&&(!imp||m.ts<imp)&&String(m.text).length>90);
  const pick=th.length>6?th.filter((m,i)=>i%Math.ceil(th.length/6)===0).slice(-6):th;
  c.voice=pick.map(m=>String(m.text).slice(0,500));
  return c.voice;
}
function repeatedBits(c){
  const mine=(S.dms[c.id]||[]).filter(m=>m.from==='them').slice(-6).map(m=>String(m.text).toLowerCase().replace(/\*[^*]*\*/g,' '));
  const cnt={};mine.forEach(t=>{const ws=t.match(/[\p{L}']+/gu)||[];const seen=new Set();for(let i=0;i<ws.length-1;i++){const g=ws[i]+' '+ws[i+1];if(ws[i].length<3&&ws[i+1].length<3)continue;if(!seen.has(g)){seen.add(g);cnt[g]=(cnt[g]||0)+1}}});
  const bits=Object.entries(cnt).filter(([g,n])=>n>=2).map(([g])=>g).slice(0,8);
  const dors=mine.filter(t=>/\bdors\b|\bdormir\b|tais-toi|te taire/.test(t)).length;
  return {bits,dors};
}
function voiceNotes(c){
  let out='';
  const v=voiceBank(c);
  if(v.length)out+=`\n\nVOIX DE RÉFÉRENCE : voici de vrais messages que ${c.name} lui a écrits auparavant. C'est EXACTEMENT ce ton-là qu'il faut retrouver (tendresse, taquinerie, longueur, richesse), sans recopier ces phrases ni ces gestes :\n${v.map(t=>'« '+t+' »').join('\n')}`;

function repairJSON(raw){
  const a=raw.indexOf('{');if(a<0)return null;
  let str=raw.slice(a),b=str.lastIndexOf('}');
  try{return JSON.parse(str.slice(0,b+1))}catch(e){}
  // close whatever was left open (missing final braces, cut-off text)
  let stack=[],inS=false,esc2=false;
  for(const ch of str){
    if(inS){if(esc2)esc2=false;else if(ch==='\\')esc2=true;else if(ch==='"')inS=false;continue}
    if(ch==='"')inS=true;else if(ch==='{')stack.push('}');else if(ch==='[')stack.push(']');else if(ch==='}'||ch===']')stack.pop();
  }
  let fixed=str.trim();if(inS)fixed+='"';
  fixed+=stack.reverse().join('');
  try{return JSON.parse(fixed)}catch(e){}
  return null;
}
function normId(x){

function normIds(o){

function randomCast(must,anchor){
  // each character independently "sees" the post; strong feelings (toward Sandra or the anchor) raise the odds
  const ids=new Set(must.filter(charById));
  S.chars.forEach(c=>{
    if(ids.has(c.id))return;
    let pr=0.3+Math.min(0.35,Math.abs(c.score)/250);
    if(anchor&&anchor!==c.id){const ps=Math.abs(pairScore(c.id,anchor));pr+=Math.min(0.25,ps/300)}
    if(Math.random()<pr)ids.add(c.id);
  });
  if(!ids.size&&S.chars.length)ids.add(S.chars[Math.floor(Math.random()*S.chars.length)].id);
  return [...ids].map(charById);
}
function pickCast(must,extra){
  const ids=[...new Set(must.filter(charById))];
  const pool=S.chars.filter(c=>!ids.includes(c.id)).map(c=>({c,w:10+Math.abs(c.score)}));
  while(extra-->0&&pool.length){
    const tot=pool.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,i=0;
    while(i<pool.length-1&&r>pool[i].w){r-=pool[i].w;i++}
    ids.push(pool.splice(i,1)[0].c.id);
  }
  return ids.map(charById);
}

async function comment(postId,text,re){

/* ---------- usage tracking ---------- */
let FEAT=null;
const dayKey=(d=new Date())=>d.toISOString().slice(0,10);
function U(){S.usage=S.usage||{days:{},since:now(),price:'sonnet',pin:3,pout:15,eur:0.86,limit:0,hard:false,users:100};return S.usage}
const tok=chars=>chars/3.5;
function trackUse(feat,inC,outC){
  const u=U();const k=dayKey();const d=u.days[k]=u.days[k]||{calls:0,i:0,o:0,f:{}};
  d.calls++;d.i+=inC;d.o+=outC;const f=d.f[feat]=d.f[feat]||{calls:0,i:0,o:0};f.calls++;f.i+=inC;f.o+=outC;
  const keys=Object.keys(u.days).sort();while(keys.length>60)delete u.days[keys.shift()];
  if(u.limit){const n=d.calls;if(n===Math.ceil(u.limit*0.8))toast(`📊 Tu as utilisé 80 % de ta limite du jour (${n}/${u.limit} appels).`);else if(n===u.limit)toast(`📊 Limite du jour atteinte (${u.limit} appels)${u.hard?' : les persos se reposent jusqu\'à demain.':'.'}`)}
  save();
}
function checkBudget(){const u=U();if(u.hard&&u.limit){const d=u.days[dayKey()];if(d&&d.calls>=u.limit)throw{code:'budget'}}}
function costOf(d){const u=U();return tok(d.i)/1e6*u.pin+tok(d.o)/1e6*u.pout}
function sumDays(n){
  const u=U();const out={calls:0,i:0,o:0,f:{}};const lim=n?dayKey(new Date(now()-(n-1)*864e5)):'';
  Object.entries(u.days).forEach(([k,d])=>{if(n&&k<lim)return;out.calls+=d.calls;out.i+=d.i;out.o+=d.o;Object.entries(d.f).forEach(([fk,f])=>{const x=out.f[fk]=out.f[fk]||{calls:0,i:0,o:0};x.calls+=f.calls;x.i+=f.i;x.o+=f.o})});
  return out;
}
const fmtN=n=>Math.round(n).toLocaleString('fr-FR');
const fmtE=usd=>{const e=usd*U().eur;return e<0.01&&e>0?'< 0,01 €':e.toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2})};
function statsView(){
  const u=U();const t=sumDays(1),w=sumDays(7),all=sumDays(0);
  const block=(lab,x)=>`<div class="stat"><div class="small">${lab}</div><div class="big">${fmtE(costOf(x))}</div><div class="small">${fmtN(x.calls)} appels, ~${fmtN(tok(x.i)+tok(x.o))} tokens</div></div>`;
  const feats=Object.entries(all.f).sort((a,b)=>costOf(b[1])-costOf(a[1]));const maxF=feats.length?costOf(feats[0][1]):1;
  const days=[];for(let i=13;i>=0;i--){const k=dayKey(new Date(now()-i*864e5));days.push([k,u.days[k]||{calls:0,i:0,o:0}])}
  const maxD=Math.max(...days.map(([,d])=>costOf(d)),1e-9);
  const nDays=Math.max(1,Object.keys(u.days).length);const avg=costOf(all)/nDays;

function queueReactions(p,r,cfg){
  const t0=now();p.queue=p.queue||[];
  const rx=Object.assign({},...(r.likes||[]).map(id=>({[id]:'❤️'})),r.reactions||{});
  Object.entries(rx).forEach(([id,e])=>{if(charById(id))p.queue.push({at:t0+rnd(...cfg.rx),k:'rx',id,e:RX.includes(e)?e:'❤️'})});
  let ct=t0+rnd(...cfg.c0);
  (r.comments||[]).forEach(cm=>{if(cm&&charById(cm.id)&&cm.text&&!/^\s*\{/.test(cm.text)){p.queue.push({at:ct,k:'c',id:cm.id,text:String(cm.text),rx:cm.reactions||null,re:cm.re==='me'||(cm.re&&charById(cm.re)&&cm.re!==cm.id)?cm.re:null});ct+=rnd(...cfg.cg)}});
  if(r.votes&&p.poll)Object.entries(r.votes).forEach(([id,ix])=>{ix=+ix;if(charById(id)&&id!==p.author&&p.poll.opts[ix])p.queue.push({at:t0+rnd(4e3,70e3),k:'vote',id,ix})});
  (r.reposts||[]).slice(0,2).forEach(x=>{if(x&&charById(x.id)&&x.id!==p.author)p.queue.push({at:t0+rnd(20e3,120e3),k:'rp',id:x.id,text:String(x.text||'').slice(0,200)})});
  if(r.myCommentReactions&&cfg.myCi!=null)Object.entries(r.myCommentReactions).forEach(([id,e])=>{if(charById(id))p.queue.push({at:t0+rnd(2e3,25e3),k:'crx',ci:cfg.myCi,id,e:RX.includes(e)?e:'❤️'})});
}
function release(p,it){
  const c=charById(it.id);if(!c)return;

  if(it.k==='rx'){setRx(p,it.id,it.e);if(p.author==='me')notify(it.e,`${c.name} a réagi ${it.e} à ton post.`,{t:'post',id:p.id})}
  else if(it.k==='crx'){const cm=p.comments[it.ci];if(cm){setRx(cm,it.id,it.e);if(cm.author==='me')notify(it.e,`${c.name} a réagi ${it.e} à ton commentaire.`,{t:'post',id:p.id})}}
  else if(it.k==='vote'){if(p.poll){p.poll.opts.forEach(o=>o.votes=o.votes.filter(v=>v!==it.id));p.poll.opts[it.ix].votes.push(it.id);if(p.author==='me')notify('📊',`${c.name} a voté à ton sondage : « ${p.poll.opts[it.ix].t} ».`,{t:'post',id:p.id})}}
  else if(it.k==='rp'){const np={id:uid(),author:it.id,text:it.text,ts,repostOf:p.id,likes:[],comments:[]};S.posts.unshift(np);if(p.author==='me')notify('🔁',`${c.name} a partagé ton post.`,{t:'post',id:np.id})}
  else if(it.k==='c'){
    const cm={author:it.id,text:it.text,ts};if(it.re){let tx='';for(let j=p.comments.length-1;j>=0;j--)if(p.comments[j].author===it.re){tx=String(p.comments[j].text).slice(0,120);break}cm.re={a:it.re,t:tx}}
    if(it.rx&&typeof it.rx==='object')Object.entries(it.rx).forEach(([id,e])=>{if(charById(id)&&id!==it.id)setRx(cm,id,RX.includes(e)?e:'❤️')});
    const iWasHere=p.comments.some(x=>x.author==='me');
    p.comments.push(cm);
    const short=it.text.length>60?it.text.slice(0,60)+'…':it.text;
    if(cm.re&&cm.re.a==='me')notify('↪️',`${c.name} a répondu à ton commentaire : « ${short} »`,{t:'post',id:p.id});
    else if(p.author==='me')notify('💬',`${c.name} a commenté ton post : « ${short} »`,{t:'post',id:p.id});
    else if(iWasHere)notify('💬',`${c.name} a répondu dans la discussion : « ${short} »`,{t:'post',id:p.id});
    else if(mentionsMe(it.text))notify('📣',`${c.name} t'a mentionnée dans un commentaire.`,{t:'post',id:p.id});
  }
}

LE STYLE DE LA LECTRICE (inspiré des fics qu'elle adore) :
- Une voix de fic écrite par une passionnée, pas de roman littéraire : langue courante et vivante, chaleureuse, spontanée. Pas de prose ampoulée, pas de métaphores en cascade.
- Point de vue très proche d'un personnage (souvent lui), avec sa voix intérieure ronchonne, sarcastique et autodérisoire : il se parle à lui-même, se traite d'idiot, jure dans sa tête (des jurons variés, inventés à sa façon, jamais le même à chaque page), se pose des questions rhétoriques, se contredit. C'est une grande source de rire et de tendresse.
- Le DIALOGUE domine : des échanges courts et vifs, des joutes verbales où chacun marque des points, des répliques familières quand le personnage s'y prête. Les amis (Harry, Ron, Ginny…) qui taquinent le couple sont bienvenus.
- L'humour naît surtout du quotidien et des caractères : une visite, un repas, un cadeau, une situation gênante, les réactions des proches, des tics et petites habitudes de personnage qui reviennent. Le burlesque est un épice, pas le plat principal.
- La romance se construit par petits gestes concrets et chaleureux (une tasse tendue, un cadeau choisi avec soin, une invitation, des doigts qui se frôlent), avec des interruptions qui retardent les aveux, et le masque qui tombe peu à peu. On doit sentir le trouble ET la tendresse.
- L'émotion se dit franchement dans la tête de l'héroïne : elle nomme ses peurs, ses espoirs, ce qu'elle redoute (« elle avait peur qu'il… »), et on la sent dans son corps (estomac noué, gorge serrée, larmes qui montent, mains qui tremblent). Pas de pudeur excessive dans ses pensées.
- Lui montre son amour surtout par les actes : calme, protecteur, concret, il trouve des solutions quand elle panique, la rassure, la touche (main sur la taille, sur la joue, doigts mêlés). Ses rares mots tendres sont sobres et maladroits, arrachés avec difficulté, et c'est pour ça qu'ils bouleversent (à formuler chaque fois avec ses propres mots).
- Le réconfort après la vulnérabilité (hurt/comfort) est un moment fort : elle craque, il est là. Laisse ces scènes durer.
- Des procédés qui marchent : un secret que la lectrice connaît avant l'autre personnage, le contraste entre un moment public (fête, cérémonie, repas de famille) et un moment privé à deux, des gestes tendres qui reviennent comme des rituels (à inventer pour chaque histoire), la vie quotidienne à deux (cohabitation, repas, projets d'avenir).

IMPORTANT : invente tes propres répliques, situations et gags. Ne réutilise jamais une réplique ou une scène d'exemple, ni des phrases toutes faites d'autres fics : chaque histoire doit être neuve.

TICS INTERDITS (la lectrice les a déjà lus dans toutes ses histoires et ne les supporte plus) : une tache d'encre sur le poignet, le doigt ou la main ; « Je ne sais pas faire ça » ou toute variante (« je ne sais pas comment on fait », « je n'ai pas l'habitude ») ; la pomme d'Adam qui monte et descend ; le thé ou la tasse comme fil rouge ; la main posée sur la nuque ; « Par Salazar » / « Par Merlin » plus d'une fois par histoire ; le pouce qui essuie une larme ; « il ne le répéterait pas avant des années ». Trouve d'autres détails, d'autres gestes et d'autres façons de dire les choses.

L'ART D'ÉCRIRE (le plus important, une histoire plate est un échec) :
- Même une histoire simple a besoin d'un moteur : ce que chacun désire, ce qui l'en empêche (orgueil, peur, passé, loyauté, malentendu, circonstances) et ce que ça lui coûte. La romance se gagne : résistance, tension, recul, puis bascule.
- Écris des SCÈNES, pas des résumés : les moments clés se vivent en temps réel, avec dialogues et gestes ; résume seulement les transitions.
- Dans les dialogues, du sous-texte : les personnages ne disent pas tout, ça passe aussi par les gestes, les silences, les piques.
- MAIS la lectrice doit RESSENTIR : écris en point de vue proche, de l'intérieur des deux personnages principaux (en alternant par scène si besoin), avec leurs pensées, leurs doutes, leur mauvaise foi intérieure, leurs sensations physiques (cœur, chaleur, gorge serrée), ce qu'ils remarquent de l'autre et ce que ça leur fait. Des pensées en italique sont bienvenues. Pas de narration distante façon caméra.
- Concentre-toi sur le couple : peu de personnages secondaires et une seule intrigue centrale, pour avoir la place de développer leur relation. Mieux vaut trois scènes approfondies que dix scènes survolées.
- Les moments forts de la relation (le premier vrai regard, la dispute, l'aveu, le premier baiser) s'écrivent SUR LA PAGE, lentement, en détail : ce qu'ils disent, ce qu'ils ressentent, ce qu'ils font. Jamais d'ellipse ou de fondu au moment clé (seule une scène intime au-delà du baiser se termine en fondu).
- Des détails précis et inattendus plutôt que génériques, inventés pour CETTE histoire ; chaque scène est ancrée dans un lieu concret avec des sensations.
- Des dialogues tranchants, propres à chaque voix, avec de l'humour même dans les moments graves quand le personnage s'y prête.
- Au moins une surprise : un retournement, une révélation ou une réaction inattendue mais cohérente.
- Fais monter la tension progressivement : frôlements, presque-aveux, interruptions ; retarde la satisfaction pour qu'elle compte.
- Varie le rythme : phrases courtes dans la tension, plus amples dans la contemplation.
- Évite les tics d'écriture qui rendent le texte mécanique : au maximum UNE comparaison en « comme un… » / « avec la dignité d'un… » par scène ; ne recycle pas le même type de blague ni le même motif à chaque page (un running gag oui, cinq non) ; varie la longueur des paragraphes.
- Laisse respirer l'émotion : dans les moments tendres ou graves, ne casse pas tout de suite avec une vanne. Laisse durer le trouble, la peur, le désir, sur plusieurs phrases, avant de revenir à l'humour.
- Les DEUX personnages principaux ont une vraie vie intérieure à parts égales : ce qu'elle ressent compte autant que ce qu'il ressent, y compris ses doutes à elle, ses envies, sa mauvaise foi.
- À bannir : les clichés (« le temps sembla s'arrêter », « un frisson parcourut son échine », « elle ne savait pas encore que… »), les réconciliations trop faciles, la morale finale, le dernier paragraphe qui résume ou commente.
- La FIN doit être claire et satisfaisante : la lectrice doit savoir sans ambiguïté où en est le couple (aveu fait, baiser échangé, ensemble ou non). Donne le moment de récompense en entier, puis termine sur une image ou une réplique forte. Pas de fin si subtile qu'on se demande si c'est fini.${f.tones.includes('Humour')?`

HUMOUR (la lectrice veut RIRE pour de vrai, pas sourire poliment : l'humour est le cœur de l'histoire, pas une décoration) :
- Pars d'une situation comique en soi : un malentendu qui dégénère, une contrainte absurde, un personnage coincé dans un rôle qui lui va très mal, un plan qui part en vrille. Le contexte doit être drôle, pas seulement les répliques.
- Une ou deux scènes peuvent partir en vrille jusqu'au chaos, mais le gros du rire vient des échanges, des pensées du personnage et des réactions des proches, dans des situations du quotidien.
- Un running gag qui revient trois fois au moins, en changeant à chaque retour, et qui paie à la fin.
- L'humour vient des personnages : leur caractère poussé à l'extrême dans la mauvaise situation (la dignité glaciale face au ridicule, l'orgueil face à l'humiliation, la mauvaise foi totale).
- Timing : chute en fin de phrase ou de paragraphe, réplique sèche juste après un moment solennel, phrases courtes pour les punchlines, silences gênants.
- Du comique de situation, de gestes et de mots, des témoins gênés, des réactions démesurées, des callbacks.
- Pas d'explication des blagues, pas de « il ne put s'empêcher de rire », pas de vannes polies et inoffensives. Ose le décalage.`:''}`;
}
function engineText(g){
  if(!g)return'';
  const L=(k,v)=>v?`\n- ${k} : ${Array.isArray(v)?v.join(' / '):v}`:'';
  return `\n\nMOTEUR SECRET DE L'HISTOIRE (suis-le fidèlement, sans jamais le citer ni l'expliquer au lecteur) :${L('Désirs et non-dits',g.desires)}${L('Obstacle',g.obstacle)}${L('Enjeu',g.stakes)}${L('Surprise',g.surprise)}${L('Motif récurrent',g.motif)}${L('Scènes clés',g.scenes)}${L('Image finale',g.ending)}${L('Mécanique comique',g.comedy)}`;
}
function storyPrompt(f,ci,plan){
  const words=LENGTHS[f.length]||1500;
  return `${storyBase(f,ci)}
Longueur : environ ${words} mots. Une vraie fin satisfaisante (une fin ouverte est permise si elle donne envie d'une suite).${engineText(plan)}

Format : première ligne exactement « TITRE : » suivi du titre, puis une ligne vide, puis l'histoire. Rien avant, rien après.`;
}
const tierOpt=f=>({route:f&&f.romance==='Épicée 🌶️'?'spicy':f&&f.fine!==false?'storyFine':'story'});
function recentStories(exceptId){
  const l=(S.stories||[]).filter(x=>x.id!==exceptId).slice(0,6).map(x=>{const g=x.engine||(x.saga&&x.saga.engine)||{};const bits=[g.obstacle,g.surprise,g.motif].filter(Boolean).map(s=>String(s).slice(0,140));return `- « ${x.title} »${bits.length?' : '+bits.join(' / '):''}`});
  return l.length?`\n\nHISTOIRES DÉJÀ ÉCRITES POUR ELLE (elle les a lues : ne recycle ni leur situation de départ, ni leur retournement, ni leurs objets fétiches ; trouve un ressort, un lieu et des gestes différents) :\n${l.join('\n')}`:'';
}

function looksCut(t){t=String(t||'').trim();if(t.length<200)return false;return !/[.!?…»"”*)\]]$/.test(t)}
function mergeCut(part,cont){
  part=String(part).replace(/\s+$/,'');cont=String(cont||'').replace(/^\s+/,'');
  if(!cont)return part;
  const m=part.match(/(^|[.!?…»"”\n])\s*([^.!?…»"”\n]*)$/);
  const frag=m?m[2]:'';const fragStart=part.length-frag.length;
  if(frag.length>=4){const probe=frag.slice(0,Math.min(25,frag.length));const k=cont.indexOf(probe);if(k>=0&&k<40)return part.slice(0,fragStart)+cont.slice(k)}
  for(let k=Math.min(60,part.length);k>=6;k--){if(cont.startsWith(part.slice(-k)))return part+cont.slice(k)}
  return /\w$/.test(part)&&/^[a-zà-ÿ]/.test(cont)?part+cont:part+' '+cont;
}
async function finishCut(entry,idx,onLive){
  const b=bodies[entry.id];const f=entry.params||F();const ci=castInfo(f);
  const s=sample||(samplePromise?await samplePromise:null);if(!s)return false;
  const part=b.chapters[idx];const tail=part.length>3000?part.slice(-3000):part;
  const next=b.chapters[idx+1]?String(b.chapters[idx+1]).slice(0,600):'';
  const isEnd=entry.saga?idx===entry.saga.total-1:!next;
  const prompt=`${storyBase(f,ci)}

Voici la fin d'un ${entry.saga||b.chapters.length>1?`chapitre (chapitre ${idx+1}) de l'histoire « ${entry.title} »`:`récit, « ${entry.title} »,`} qui a été interrompu en pleine phrase :
---
${tail}
---
${next?`Le chapitre suivant commence ainsi (ta suite doit y mener naturellement, sans le répéter) :\n---\n${next}\n---\n`:''}
Écris la fin manquante. Commence en recopiant mot pour mot la phrase interrompue depuis son début, puis termine-la et conclus la scène de façon cohérente avec tout ce qui précède, ${isEnd?"jusqu'à une vraie fin d'histoire":"jusqu'à une fin de chapitre naturelle"} (150 à 600 mots). Même style, mêmes personnages. Uniquement le texte, sans titre, sans résumé ni commentaire.`;
  let cont='';
  try{checkBudget();await s(prompt,{cache:false,...tierOpt(f),signal:storyCtl?storyCtl.signal:undefined,onText:({text})=>{cont=text;if(onLive)onLive(mergeCut(part,text))}})}catch(e){const t=errText(e);if(t)toast(t)}
  if(cont)trackUse('Histoires',prompt.length,cont.length);
  cont=splitSummary(cont).body;
  if(!cont.trim()){b.chapters[idx]=part;return false}
  b.chapters[idx]=mergeCut(part,cont);return true;
}

}

Format : première ligne « CHAPITRE : » suivi du titre du chapitre, puis une ligne vide, puis le texte. À la toute fin, sur une ligne séparée, écris « RÉSUMÉ : » suivi d'un résumé du chapitre en 2 ou 3 phrases, puis sur une autre ligne « FAITS : » suivi, une par ligne commençant par « - », des NOUVEAUX faits concrets établis dans ce chapitre qu'il faudra respecter ensuite (texte exact des mots, étiquettes, lettres ou règles écrits ; objets donnés et leur origine ; qui sait quoi ; dates ; détails physiques). Ni le résumé ni les faits ne seront montrés à la lectrice. Rien d'autre.`;
  busy.story=id;busy.storyCh=n-1;if(n===1)entry.readCh=0;render();

  try{checkBudget();await s(prompt,{cache:false,...tierOpt(f),signal:storyCtl.signal,onText:({text})=>{last=text;const q=parse(text);sg.titles[n-1]=q.title;b.chapters[n-1]=q.body.replace(/^\s+/,'');liveUpdate(id)}})}
  catch(e){const t=errText(e);if(t)toast(t)}
  if(last)trackUse('Histoires',prompt.length,last.length);
  const q=parse(last);
  delete busy.story;storyCtl=null;
  if(!q.body.trim()){delete busy.storyCh;b.chapters.splice(n-1,1);sg.titles.splice(n-1,1);save();render();return false}
  b.chapters[n-1]=q.body.trim();
  if(!q.summary&&looksCut(q.body)){toast('Le chapitre a été coupé : la plume le termine…');await finishCut(entry,n-1,t=>{b.chapters[n-1]=t;liveUpdate(id)})}
  if(storyCtl&&!storyCtl.signal.aborted){toast('✨ Relecture du chapitre…');const pz=await polish(b.chapters[n-1],f);if(pz){b.chapters[n-1]=pz;liveUpdate(id)}}
  delete busy.storyCh;
  sg.titles[n-1]=q.title;sg.done=b.chapters.length;
  if(curCh(b,entry)!==n-1){entry.newCh=(entry.newCh||[]).concat(n-1);toast(`✨ Le chapitre ${n} est prêt.`)}const fi=String(q.summary||'').search(/\n?\s*\**\s*FAITS\s*:/i);
  let sum=q.summary||'',facts=[];
  if(fi>=0){facts=String(q.summary).slice(fi).replace(/^\s*\**\s*FAITS\s*:\s*/i,'').split(/\n/).map(x=>x.replace(/^\s*[-•*]\s*/,'').trim()).filter(Boolean);sum=String(q.summary).slice(0,fi).trim()}
  sg.summaries[n-1]=sum||q.body.slice(0,400);
  sg.facts=(sg.facts||[]).concat(facts.map(x=>x.slice(0,300)));
  while(sg.facts.join('\n').length>9000&&sg.facts.length>15)sg.facts.splice(15,1);
  entry.words=wordCount(b);await saveBody(id);save();render();return true;
}

async function continueStory(id,direction){
  {const e0=S.stories.find(x=>x.id===id);if(e0&&e0.saga){if(busy.story)return;await loadBody(id);if(bodies[id]&&bodies[id].chapters.length<e0.saga.total)await writeChapter(e0,direction);return}}
  const entry=S.stories.find(x=>x.id===id);const b=await loadBody(id);if(!entry||!b||busy.story)return;
  const s=sample||(samplePromise?await samplePromise:null);if(!s){toast(errText({code:'unavailable'}));return}
  const f=entry.params||F();const ci=castInfo(f);
  const prev=b.chapters.join('\n\n');const ctx=prev.length>9000?'[...]\n'+prev.slice(-9000):prev;
  const n=b.chapters.length+1;
  b.chapters.push('');busy.story=id;busy.storyCh=n-1;if(entry.readCh==null)entry.readCh=0;render();
  const prompt=`${storyPrompt(f,ci).split('\n\nFormat :')[0]}

Voici l'histoire « ${entry.title} » jusqu'ici :
"""
${ctx}
"""

Écris le chapitre ${n}, environ ${LENGTHS[f.length]||1500} mots, dans la continuité exacte (même style, mêmes personnages, cohérence avec tout ce qui précède).${direction?` Direction souhaitée par la lectrice : ${direction}.`:''} Commence directement par le texte, sans titre ni récapitulatif.`;
  storyCtl=new AbortController();let last='';
  try{checkBudget();await s(prompt,{cache:false,...tierOpt(f),signal:storyCtl.signal,onText:({text})=>{last=text;b.chapters[b.chapters.length-1]=text;liveUpdate(id)}})}
  catch(e){const t=errText(e);if(t)toast(t)}
  if(last)trackUse('Histoires',prompt.length,last.length);

  if(looksCut(last)&&storyCtl&&!storyCtl.signal.aborted){toast('Le chapitre a été coupé : la plume le termine…');await finishCut(entry,b.chapters.length-1,t=>{b.chapters[b.chapters.length-1]=t;liveUpdate(id)})}

  delete busy.storyCh;
  if(!last.trim())b.chapters.pop();
  else if(curCh(b,entry)!==b.chapters.length-1){entry.newCh=(entry.newCh||[]).concat(b.chapters.length-1);toast(`✨ Le chapitre ${b.chapters.length} est prêt.`)}

`;
}

    ${pendingSecret(c)>=0?`<button class="btn gold small" data-secret="${c.id}" style="margin-top:8px">🤫 ${esc(c.name.split(' ')[0])} a quelque chose à te confier</button>`:''}

    </details></div>`).join('');

let lastView='';
function render(){
  S.stories=S.stories||[];
  const vkey=[tab,openChat,profileId,storyOpen].join('|');const kept={};let foc=null,sel=null;
  if(vkey===lastView)document.querySelectorAll('#view input[type=text],#view textarea').forEach(el=>{const k=el.id||('cin:'+(el.dataset.cin||''));kept[k]=el.value;if(el===document.activeElement){foc=k;try{sel=[el.selectionStart,el.selectionEnd]}catch(e){}}});
  renderInner();
  lastView=[tab,openChat,profileId,storyOpen].join('|');
  if(lastView===vkey)document.querySelectorAll('#view input[type=text],#view textarea').forEach(el=>{const k=el.id||('cin:'+(el.dataset.cin||''));if(k in kept&&el.value!==kept[k])el.value=kept[k];if(k===foc){try{el.focus({preventScroll:true});if(sel)el.setSelectionRange(sel[0],sel[1])}catch(e){}}});
  updateBell();
}
function renderInner(){
  const hd=document.querySelector('header.top');if(hd)document.documentElement.style.setProperty('--hh',hd.offsetHeight+'px');
  const v=document.getElementById('view');
  const nav=document.getElementById('tabs');
  document.getElementById('who').textContent=`${S.me.emoji} ${S.me.name}`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  document.getElementById('dmBadge').innerHTML=Object.keys(S.unread).some(k=>S.unread[k])?'<span class="badge"></span>':'';
  const keepPost=document.getElementById('newpost')?.value||'';
  const keepDm=document.getElementById('dmin')?.value||'';
  if(tab==='feed'){v.innerHTML=feedView();nav.hidden=false;const np=document.getElementById('newpost');if(np)np.value=keepPost}
  else if(tab==='dms'&&openChat&&openChat.startsWith('g:')&&gid(openChat.slice(2))){S.unread[openChat]=0;v.innerHTML=groupView(gid(openChat.slice(2)));nav.hidden=true;const i=document.getElementById('dmin');if(i)i.value=keepDm}
  else if(tab==='dms'&&openChat&&charById(openChat)){S.unread[openChat]=0;v.innerHTML=chatView(charById(openChat));nav.hidden=true;const i=document.getElementById('dmin');if(i)i.value=keepDm}
  else if(tab==='dms'){openChat=null;v.innerHTML=dmListView();nav.hidden=false}
  else if(tab==='notifs'){v.innerHTML=notifsView();nav.hidden=false;markRead()}
  else if(tab==='profile'){v.innerHTML=profileView();nav.hidden=false}
  else if(tab==='stats'){v.innerHTML=statsView();nav.hidden=false}
  else if(tab==='stories'){v.innerHTML=storiesView();nav.hidden=false}
  else{v.innerHTML=charsView();nav.hidden=false}
}

document.getElementById('ov').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='ovclose'){snapView=null;snapCompose=false;renderOv();render();return}
  if(t.id==='ovnext'){nextSnap(1);return}
  if(t.id==='ovprev'){nextSnap(-1);return}
  if(t.id==='ovnew'){snapView=null;snapCompose=true;renderOv();return}
  if(t.dataset.snapdel){ask('Supprimer cette story ?',()=>{S.snaps=(S.snaps||[]).filter(s=>s.id!==t.dataset.snapdel);snapView=snapsOf('me').length?{author:'me',i:0}:null;ovKey='';save();renderOv();render()});return}
  if(t.id==='snappub'){const x=(document.getElementById('snapin').value||'').trim();if(!x)return;S.snaps=S.snaps||[];S.snaps.push({id:uid(),author:'me',text:x.slice(0,400),ts:now(),seen:true});snapCompose=false;save();renderOv();render();toast('Story publiée pour 24 h.');
    const pool=S.chars.filter(c=>c.score>-20);if(pool.length&&Math.random()<0.6){const w=pool.map(c=>10+Math.max(0,c.score));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<w.length-1&&r>w[i]){r-=w[i];i++}const c=pool[i];setTimeout(()=>spontaneous(c,`${S.me.name} vient de publier une story (publication éphémère de 24 h) : « ${x} ». Ton message privé est une réaction spontanée à cette story, à ta façon.`),rnd(15e3,60e3))}
    return}
  if(t.id==='ovsend'){const i=document.getElementById('ovreply');const x=(i.value||'').trim();if(!x||!snapView)return;const s=snapsOf(snapView.author)[snapView.i];i.value='';if(s){sendDM(s.author,`↪️ ${x}`,`CONTEXTE : ce message de ${S.me.name} répond à ta story : « ${s.text} ».`);toast(`Réponse envoyée à ${nameOf(s.author)}.`)}return}
});

      dbRef=db;myId=id;dbReadyResolve(true);
      if(storyOpen){const sid=storyOpen;loadBody(sid,true).then(()=>{if(storyOpen===sid&&!busy.story)render()})}
      const col=db.collection('data/users/'+id);
      let rs=null;for(let a=0;;a++){try{rs=await getKey(col,'state');break}catch(e){if(a>=2)throw e;await new Promise(r=>setTimeout(r,1500))}}
      if(rs){
        const remote=JSON.parse(rs);
        if(remote&&remote.chars){
          remote.dms=remote.dms||{};
          await Promise.all(remote.chars.map(async c=>{try{const xs=await getKey(col,'dm-'+c.id);if(xs){const t=JSON.parse(xs);if(Array.isArray(t)&&t.length>=(remote.dms[c.id]||[]).length)remote.dms[c.id]=t}}catch(e){}}));
          await Promise.all((remote.groups||[]).map(async g=>{try{const xs=await getKey(col,'grp-'+g.id);if(xs){const t=JSON.parse(xs);if(Array.isArray(t))g.msgs=t}}catch(e){}g.msgs=g.msgs||[]}));
          if(!remote.fresh&&((remote.sid&&remote.sid!==S.sid)||contentAt(remote)>=contentAt(S))){
            S=remote;
            if(!absence){const g=now()-(S.lastSeen||0);if(S.lastSeen&&g>2*3600e3&&S.chars.length>=2)absence={hours:Math.round(g/3600e3),since:S.lastSeen,state:'idle'}}
          }
          S.lastSeen=now();migrate();render();
        }
      }
      if(!S.sid)S.sid=uid();
      remoteLoaded=true;
      S.chars.forEach(async c=>{try{const v=await getKey(col,'voice-'+c.id);if(v){const a=JSON.parse(v);if(Array.isArray(a)&&a.length){c.voice=a.map(x=>String(x).slice(0,500));c.voiceSeeded=true}}}catch(e){}});
      try{
        const qs=await col.get();let n=0;
        for(const d of qs.docs){
          if(!d.id.startsWith('story-')||d.id.includes('~'))continue;const sid=d.id.slice(6);
          if((S.stories||[]).some(x=>x.id===sid))continue;
          try{
            const raw=await getKey(col,d.id);if(!raw)continue;
            const b=JSON.parse(raw);if(!b||!Array.isArray(b.chapters)||!b.chapters.join('').trim())continue;
            bodies[sid]=b;const m=b.meta||{};
            S.stories=S.stories||[];
            S.stories.push({id:sid,title:m.title||('Histoire retrouvée : '+b.chapters[0].trim().split(/\s+/).slice(0,6).join(' ')+'…'),chars:m.chars||[],ts:m.ts||now(),fav:false,params:m.params||JSON.parse(JSON.stringify(F())),saga:m.saga,words:wordCount(b)});n++;
          }catch(e){}
        }
        if(n){S.stories.sort((a,b)=>b.ts-a.ts);toast(`📚 ${n} histoire${n>1?'s':''} retrouvée${n>1?'s':''} et remise${n>1?'s':''} dans ta bibliothèque.`);render()}
      }catch(e){}
      save();
    }catch(e){banner(`⚠️ Impossible de charger la sauvegarde en ligne (${e&&e.code||'erreur'}). Les données de cet appareil sont utilisées.`)}
  });;
}
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
